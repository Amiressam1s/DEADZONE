<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>DEADZONE</title><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><style>:root{--bg:#050508;--fg:#dfe3ff;--ac:#4af;--hot:#f44;--gold:#fa4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

{n:'Heavy Blade',dmg:4,arc:2,rng:92,wind:.28,act:.12,rec:.42,kb:550,stg:1.1,par:.12,brk:1}];

assassin:{hp:3,r:10,sp:210,col:'#c66bff',n:4},heavy:{hp:14,r:20,sp:60,col:'#ff8833',n:6,ns:1},disrupt:{hp:4,r:12,sp:85,col:'#44ff99',n:5},

{id:'pockets',n:'Deep Pockets',d:'Reserve ammo capacity +67%.'},{id:'riposte',n:'Riposte',d:'Counters after dodge or parry deal triple damage; longer slow-mo.'},

{id:'stagger',n:'Breaker',d:'Counter attacks stagger enemies.'},{id:'phantom',n:'Phantom Dash',d:'After a perfect dodge, your next dash slashes enemies.'},{id:'counter',n:'Counterstrike',d:'Perfect parries empower your next melee hit with bonus damage and stagger.'},{id:'quick',n:'Quickdraw',d:'Dashing briefly speeds up firing and reloading.'},{id:'mom',n:'Momentum',d:'Chained hits build up to +40% damage. Taking damage resets it.'},{id:'exec',n:'Execution Protocol',d:'A melee hit finishes any enemy under 30% HP (4s cooldown).'},{id:'last',n:'Last Stand',d:'Under 30% HP: +30% damage, faster dash, wider parry window.'}];
const ROOMS=[
{n:'Warm-Up',obs:[[440,260,80,20]],en:[['hunter',300,150],['hunter',660,150]]},
{n:'Cover',obs:[[300,250,20,100],[640,250,20,100],[440,200,80,24,1]],en:[['gunner',480,110],['hunter',200,200],['hunter',760,200]]},
{n:'Hold the Line',heal:1,obs:[[200,300,120,20],[640,300,120,20]],en:[['shield',480,160],['hunter',250,150],['gunner',720,120]]},
{n:'Blink',up:1,obs:[[460,230,40,40,1],[250,330,60,20],[650,330,60,20]],en:[['assassin',480,130],['gunner',200,120],['gunner',760,120]]},
{n:'Danger Zone',obs:[[300,200,20,160],[640,200,20,160]],en:[['disrupt',480,110],['hunter',200,160],['gunner',760,150],['hunter',700,200]],
 hard:{n:'Gauntlet',obs:[[460,250,40,40,1]],en:[['heavy',480,140],['shield',250,150],['shield',710,150],['gunner',480,300]]}},
{n:'THE EXECUTIONER',heal:1,up:1,obs:[[180,200,40,40,1],[740,200,40,40,1],[460,300,40,40]],en:[['exec',480,150]]},
{n:'Heavy Metal',obs:[[300,260,100,20],[560,260,100,20]],en:[['heavy',480,140],['hunter',220,160,1],['hunter',740,160]]},

 hard:{n:'Gauntlet II',obs:[[460,280,40,40]],en:[['assassin',250,130],['assassin',480,110],['assassin',710,130],['disrupt',480,200]]}},
{n:'Crossfire',up:1,hz:[[430,420,100,60]],obs:[[210,260,40,120],[710,260,40,120],[460,330,40,40,1]],en:[['shield',300,130],['shield',660,130],['gunner',200,180,1],['gunner',760,180]]},

{n:'DEADZONE',obs:[[460,280,40,40,1]],en:[['dz',480,130]]}];

const TH=[['#18182e','#0a0a13','#3a3a78','#48f'],['#261428','#0e0810','#6a3a78','#c4f'],['#122624','#08100f','#2a6a62','#3fd'],['#2c1414','#120808','#7a2a3a','#f44'],['#2a2410','#100d06','#7a6a2a','#fb3'],['#1c1c1c','#080808','#888','#fff']],THI=[0,0,0,0,0,3,1,1,1,2,4,5],TAG={exec:'He has never lost a duel.',warden:'Nothing leaves this arena.',dz:'The last thing left in the dead zone.'};
let state='menu',paused=false,p,es=[],ps=[],fx=[],zs=[],obs=[],hz=[],st,up={},hard=0,ri=0,cur=null,inHard=0,snap,ets=1,etsT=0,hs=0,shake=0,bn=null,clearT=0,last=0,keys={},press={},mouse={x:480,y:300,rx:480,ry:300,l:0,r:0},SID=0,hitIds=new Set(),flash=0,hzT=0,rt=0,rd=0,dr=[],beat=0,intro=null,seenB={},cam={x:0,y:0,z:1};
const maxRes=i=>GUNS[i].mag*(up.pockets?5:3);
const fmt=s=>s?Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0'):'--';
const newP=()=>({x:480,y:500,vx:0,vy:0,kx:0,ky:0,r:11,hp:100,mhp:100,gi:0,mi:0,ammo:GUNS.map(g=>({m:g.mag,r:g.mag*3})),face:0,dT:0,dCd:0,dd:{x:0,y:-1},pCd:0,pT:0,lock:0,inv:0,sw:0,rl:0,fcd:0,ma:null,cmb:0,cmbT:0,cnt:0,cm:2,pdU:0,phR:0,phA:0,cs:0,qd:0,exCd:0,combo:0,comboT:0});

/* ---------- helpers ---------- */
function pushOut(o,rad){for(const b of obs){const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h),dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);if(d<rad){if(d>.001){o.x+=dx/d*(rad-d);o.y+=dy/d*(rad-d)}else o.y=b.y-rad}}o.x=clamp(o.x,50+rad,W-50-rad);o.y=clamp(o.y,50+rad,H-50-rad)}
function mv(o,vx,vy,dt){const n=Math.max(1,Math.ceil(Math.hypot(vx,vy)*dt/6));for(let i=0;i<n;i++){o.x+=vx*dt/n;o.y+=vy*dt/n;pushOut(o,o.r)}}
const go=(e,a,s,dt)=>mv(e,cs(a)*s,sn(a)*s,dt);
function burst(x,y,c,n,s){if(fx.length>350)return;for(let i=0;i<n;i++)fx.push({x,y,vx:rnd(-s,s),vy:rnd(-s,s),t:.4,T:.4,c,r:rnd(1.5,3.5)})}
const ring=(x,y,c,r)=>fx.push({ring:1,x,y,r,t:.35,T:.35,c});
function sparks(x,y,c,n,sp,len,a0){for(let i=0;i<n;i++){const a=a0==null?rnd(0,6.28):a0+rnd(-.7,.7),v=rnd(sp*.5,sp);if(fx.length<420)fx.push({sh:1,x,y,vx:cs(a)*v,vy:sn(a)*v,rot:a,vr:0,len:rnd(len*.6,len),t:rnd(.2,.4),T:.4,c})}}

/* ---------- flow ---------- */
function ov(h){UI.innerHTML=h;UI.style.display='flex';if(document.activeElement)document.activeElement.blur()}
function music(){if(state!='play'||paused||!es.length)return;beat=(beat+1)%16;const n=[55,55,65,55,49,55,73,65][beat%8];snd(n,.22,'sawtooth',.03,.6);if(beat%4==0)snd(40,.15,'sine',.08,.5);if(es.some(e=>e.boss)&&beat%2)snd(n*4,.05,'square',.012,.5)}
function menu(){state='menu';paused=false;const b=SV.best||{};ov(`<h1>DEADZONE</h1><p>Dodge. Parry. Punish.</p><button onclick="start(0)">Start Campaign</button>${SV.won?'<button onclick="start(1)">Hard Mode</button>':''}<button onclick="ctl()">Controls</button><button onclick="sett()">Settings</button><p>Best: ${fmt(b.n)}${SV.won?' &middot; Hard '+fmt(b.h):''}</p>`)}
function ctl(){if(TOUCH)return ov('<h2>CONTROLS</h2><p>Left thumb: move. Right thumb: drag to aim &mdash; you shoot while aiming, with a little aim assist.<br>DASH, SLASH, PARRY and R (reload) are on the right. GUN and BLADE switch weapons.<br><b style="color:#fd3">Yellow</b> warnings can be parried; <b style="color:#f55">red</b> ones must be dodged.</p><button onclick="menu()">Back</button>');const K=(k,d)=>`<span><kbd>${k}</kbd>${d}</span>`;ov(`<h2>CONTROLS</h2><div class="kb">${K('WASD','Move')}${K('MOUSE','Aim')}${K('LMB','Shoot')}${K('RMB','Slash')}${K('SPACE','Dash')}${K('Q','Parry')}${K('E','Gun')}${K('F','Blade')}${K('R','Reload')}${K('ESC','Pause')}${K('M','Mute')}</div><p><b style="color:#fd3">Yellow</b> warnings can be parried &mdash; parry at the very start of the window for a <b>Perfect Parry</b>. <b style="color:#f55">Red</b> warnings must be dodged. Dash through an attack at the last instant for a <b>Perfect Dodge</b>.</p><button onclick="menu()">Back</button>`)}
function sett(){ov(`<h2>SETTINGS</h2><button onclick="SV.mute=!SV.mute;save();sett()">Sound: ${SV.mute?'OFF':'ON'}</button><button onclick="SV.sk=((SV.sk==null?2:SV.sk)+2)%3;save();sett()">Screen shake: ${['OFF','REDUCED','FULL'][SV.sk==null?2:SV.sk]}</button><button onclick="menu()">Back</button>`)}
function start(h){if(!window.dzm)window.dzm=setInterval(music,230);hard=h;seenB={};up={};ri=0;inHard=0;st={shots:0,hits:0,pd:0,par:0,deaths:0,time:0,pp:0,dt:0,bc:0,nd:0};p=newP();startRoom(ROOMS[0])}
function startRoom(r){snap={hp:p.hp,ammo:JSON.stringify(p.ammo),up:{...up},gi:p.gi,mi:p.mi,ri,inHard};loadRoom(r)}
function loadRoom(r){cur=r;obs=r.obs.map(o=>({x:o[0],y:o[1],w:o[2],h:o[3],hp:o[4]?6:0,d:!!o[4]}));hz=(r.hz||[]).map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));hzT=0;
 es=r.en.map((e,i)=>mk(e[0],e[1],e[2],i,e[3]));es.forEach(e=>{for(let i=0;i<3;i++)pushOut(e,e.r)});ps=[];fx=[];zs=[];dr=[];clearT=0;ets=1;etsT=0;hs=0;rt=st.time;rd=st.dt;
 Object.assign(p,{x:480,y:500,vx:0,vy:0,kx:0,ky:0,dT:0,dCd:0,pT:0,pCd:0,lock:0,inv:1,ma:null,rl:0,cnt:0,pdU:0,sw:0,fcd:0,cs:0,qd:0,combo:0,comboT:0});
 const bo=es.find(e=>e.boss),first=bo&&!seenB[bo.type];intro=null;bn=null;if(bo)seenB[bo.type]=1;if(first){bo.sp0=2.6;intro={t:2.6,T:2.6,nm:bo.nm,tag:TAG[bo.type],col:bo.col,x:bo.x,y:bo.y}}else bn={s:r.n,t:1.8};state='play';paused=false;UI.style.display='none';cam.x=clamp(p.x-W/ZM/2,0,W-W/ZM);cam.y=clamp(p.y-H/ZM/2,0,H-H/ZM)}
function retry(){p.hp=Math.max(snap.hp,45);p.ammo=JSON.parse(snap.ammo);up={...snap.up};p.gi=snap.gi;p.mi=snap.mi;ri=snap.ri;inHard=snap.inHard;loadRoom(cur)}
function pause(){if(state!='play')return;paused=!paused;keys={};press={};mouse.l=mouse.r=0;TJ.id=TA.id=null;TJ.x=TJ.y=TA.on=0;for(const k in tbs){tbs[k].on=0;delete tbs[k]}if(paused)ov('<h2>PAUSED</h2><button onclick="pause()">Resume</button><button onclick="retry()">Restart Encounter</button><button onclick="menu()">Main Menu</button>');else UI.style.display='none'}
function die(){state='dead';st.deaths++;snd(80,.6,'sawtooth',.12,.3);ov('<h2 style="color:#f44">YOU DIED</h2><button onclick="retry()">Retry (Enter)</button><button onclick="menu()">Main Menu</button>')}
function afterClear(){ps=[];zs=[];if(cur.heal)p.hp=Math.min(p.mhp,p.hp+40);p.ammo.forEach((a,i)=>a.r=maxRes(i));
 if(cur.hard&&!inHard){state='ov';ov(`<h2>${cur.n} CLEARED</h2><p>Choose your route.</p><button onclick="route(0)">Safe Path<br><small>Restore 25 HP</small></button><button onclick="route(1)">Gauntlet<br><small>Harder fight, bonus upgrade</small></button>`);return}
 if(cur.up||inHard)return pickUp();nextRoom()}
function route(h){if(h){inHard=1;startRoom(cur.hard)}else{p.hp=Math.min(p.mhp,p.hp+25);nextRoom()}}
function pickUp(){const pool=UPS.filter(u=>!up[u.id]).sort(()=>Math.random()-.5).slice(0,3);if(!pool.length){inHard=0;return nextRoom()}
 state='ov';ov(`<h2>CHOOSE AN UPGRADE</h2><div class="up">${pool.map(u=>`<button onclick="takeUp('${u.id}')">${u.n}<small>${u.d}</small></button>`).join('')}</div>`)}
function takeUp(id){up[id]=1;if(id=='pockets')p.ammo.forEach((a,i)=>a.r=maxRes(i));inHard=0;nextRoom()}
function nextRoom(){ri++;if(ri>=ROOMS.length)return win();startRoom(ROOMS[ri])}
function score(){const a=st.shots?st.hits/st.shots*100:0;return Math.max(0,Math.round(12000-st.time*3-st.dt*3-st.deaths*300+st.pd*80+st.pp*150+st.par*50+st.bc*60+st.nd*100+a*20))}
function win(){state='ov';const k=hard?'h':'n';SV.best=SV.best||{};const nb=!SV.best[k]||st.time<SV.best[k];if(nb)SV.best[k]=st.time;SV.won=1;save();const sc=score(),rk=sc>=15000?'S':sc>=12000?'A':sc>=9000?'B':'C';
 ov(`<h1 style="font-size:3em">DEADZONE DEFEATED</h1><p>Time <b>${fmt(st.time)}</b>${nb?' (new best!)':' &middot; best '+fmt(SV.best[k])}<br>Deaths ${st.deaths} &middot; Accuracy ${st.shots?Math.round(st.hits/st.shots*100):0}%<br>Perfect dodges ${st.pd} &middot; Parries ${st.par} (${st.pp} perfect)<br>Damage taken ${Math.round(st.dt)} &middot; Best combo ${st.bc}</p><h2>RANK ${rk} &middot; ${sc}</h2><p style="font-size:.7em">Score = 12000 &minus; 3/sec &minus; 3/damage &minus; 300/death + 80/perfect dodge + 50/parry + 150/perfect parry + 60/best combo hit + 100/no-damage room + 20/accuracy %. S 15000 &middot; A 12000 &middot; B 9000</p><button onclick="start(${hard})">Replay${hard?' (Hard)':''}</button><button onclick="start(1)">Hard Mode</button><button onclick="menu()">Main Menu</button>`)}

/* ---------- enemies ---------- */
function mk(t,x,y,i,el){const d=ED[t],m=(hard?1.25:1)*(el?1.5:1);return{type:t,x,y,r:d.r,n:d.n,sh:d.sh,ns:d.ns,boss:d.boss,th:d.th,nm:d.nm,col:d.col,hp:d.hp*m,mhp:d.hp*m,sp:d.sp*(hard?1.15:1),face:Math.PI/2,at:null,q:[],rec:0,cd:d.boss?1.5:rnd(.8,1.8),stun:0,stI:0,fl:0,inv:0,kx:0,ky:0,sp0:.6+i*.15,o:rnd(0,6.28),sd:1,sdT:0,ph:0,tm:hard?.85:1,tm0:hard?.85:1,el,blk:d.sh?1:0,dsh:0}}
function atk(e,o){const k={k:'melee',rng:60,ang:1.5,dmg:12,par:1,rec:.6,t:.6,...o,dir:e.face};k.t=k.T=k.t*e.tm;k.rec*=e.tm;return k}
